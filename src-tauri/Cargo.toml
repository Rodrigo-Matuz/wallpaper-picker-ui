[package]
name = "wallpaper-picker-ui"
version = "3.8.0"
description = "A simple UI for selecting and applying wallpapers with a customizable command."
authors = ["Rodrigo Matuz <rodrigosantoslima1311@gmail.com>"]
repository = "https://github.com/Rodrigo-Matuz/wallpaper-picker-ui"
edition = "2021"

[lib]
name = "wallpaper_picker_ui_lib"
crate-type = ["cdylib", "staticlib", "lib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2.2.0"
walkdir = "2.5.0"
colored = "2.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "=0.4.38", default-features = false, features = ["std"] }
semver = "=1.0.28"
reqwest = { version = "=0.13.1", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-fs = "2"
tauri-plugin-process = "2.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.13.2"
