[package]
name = "wallpaper-picker-ui"
version = "3.4.0"
description = "A simple UI for selecting and applying wallpapers with a customizable command."
authors = ["Rodrigo Matuz <rodrigosantoslima1311@gmail.com>"]
repository = "https://github.com/Rodrigo-Matuz/wallpaper-picker-ui"
edition = "2021"

[lib]
name = "wallpaper_picker_ui_lib"
crate-type = ["cdylib", "staticlib", "lib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2.2.0"
walkdir = "2.5.0"
colored = "2.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-process = "2.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
