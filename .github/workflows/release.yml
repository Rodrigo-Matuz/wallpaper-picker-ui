# Release workflow: triggered by pushing a version tag (e.g. `git tag v3.4.0 && git push origin v3.4.0`).

# Requirements on the repository side (Settings → Secrets and variables → Actions):
# - TAURI_SIGNING_PRIVATE_KEY: minisign private key for the updater
#   (`bunx @tauri-apps/cli signer generate -w ~/.tauri/wallpaper-picker-ui.key`)
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: the password chosen when generating it

# The build creates a draft GitHub release with installers (deb/rpm/AppImage on
# Linux, NSIS only on Windows) and updater artifacts; review and publish it.

# After the Linux bundle is built, the workflow updates flake.nix with the
# new version and the hash of that exact .deb, then commits to main.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges platform assets and updater metadata into the same
      # draft release. Keep those writes serialized instead of racing on
      # latest.json while retaining one matrix definition for both platforms.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: "Wallpaper Picker UI v__VERSION__"
          # Keep the release page concise and self-contained. GitHub also adds
          # the generated commit change list below this body.
          releaseBody: |
            ## New

            - Added selectable theme families with dark and light variants, including Arctic and Orchid.
            - Added independent global controls for roundness, shadow strength, and spacing, so color themes can be mixed with different visual styles.
            - Added Home Manager options for initializing the independent theme appearance settings.
            - Hardened thumbnail generation and cache recovery with app-owned paths, validated outputs, atomic map updates, and failure-safe replacement.

            ## Fixed

            - DeepOcean preview icons now remain blue instead of inheriting the purple accent.
            - Destructive actions remain visually dangerous across every theme.
            - Selected wallpaper cards now preserve the configured global radius.
            - Custom `$VP` paths are passed as data instead of being inserted into command syntax.
            - The Windows playback notice is shown in Settings rather than on Home.
            - Fixed broken WebKitGTK layout metrics when running the app through the Nix development shell.
          generateReleaseNotes: true
          uploadUpdaterJson: true
          # Keep the legacy Windows alias on the same NSIS payload as the exact key.
          # App eligibility still requires proven installation provenance.
          updaterJsonPreferNsis: true
          releaseDraft: true
          prerelease: false

      # ── Post-release: update flake.nix to track the new version ──────────
      # Only runs on the Linux job to avoid duplicate commits.
      - name: Update flake.nix version and deb SHA256
        if: runner.os == 'Linux' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"            # e.g. v3.5.0
          VERSION="${TAG#v}"                  # e.g. 3.5.0
          # Bundle names follow productName and can contain spaces; do not
          # infer their prefix from the executable name.
          shopt -s nullglob
          DEBS=(src-tauri/target/release/bundle/deb/*_"${VERSION}"_amd64.deb)
          if [ "${#DEBS[@]}" -ne 1 ]; then
            printf 'Expected exactly one amd64 .deb for %s; found %s\n' "$VERSION" "${#DEBS[@]}" >&2
            exit 1
          fi
          DEB="${DEBS[0]}"

          echo "Tag: $TAG  Version: $VERSION"
          test -f "$DEB"
          # The release is still a draft: use the local artifact, not its
          # GitHub download URL (draft release assets are not public).
          HASH=$(openssl dgst -sha256 -binary "$DEB" | base64 -w0)

          # Both replacements must match exactly once; fail rather than
          # silently committing a version with the previous release's hash.
          FLAKE="flake.nix"
          grep -qE '^[[:space:]]*version = "[^"]+";' "$FLAKE"
          grep -qE '^[[:space:]]*hash = "sha256-[^"]+";' "$FLAKE"
          sed -i -E "s|^([[:space:]]*)version = \"[^\"]+\";|\1version = \"${VERSION}\";|" "$FLAKE"
          sed -i -E "s|^([[:space:]]*)hash = \"sha256-[^\"]+\";|\1hash = \"sha256-${HASH}\";|" "$FLAKE"

          echo "=== flake.nix updated ==="
          git diff "$FLAKE" || true

      - name: Commit updated flake.nix
        if: runner.os == 'Linux' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(flake): bump to ${{ github.ref_name }}"
          file_pattern: flake.nix
          branch: main

  verify_release:
    # The build matrix is serialized because tauri-action merges platform assets
    # and updater metadata into the same draft release. This job reads only
    # after both platform uploads have completed.
    # Metadata/sidecar consistency is not payload cryptography or install/reopen acceptance.
    needs: build
    permissions:
      # GitHub requires push access to list draft releases. The verifier remains
      # GET-only: it never rewrites assets or publishes the draft.
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Verify final draft manifest and uploaded signature sidecars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release-contract/verify.ts
