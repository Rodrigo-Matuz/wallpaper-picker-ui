name: Native updater acceptance

# Native installers may execute only on disposable hosted runners, by explicit dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-updater-acceptance
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: nsis
            target: windows-x86_64-nsis
          - case: msi
            target: windows-x86_64-msi
          - case: coexistence
            target: windows-x86_64-msi
    env:
      WALLPAPER_PICKER_NATIVE_ACCEPTANCE: "1"
      CASE: ${{ matrix.case }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify artifact and workflow contracts without native operations
        run: |
          python scripts/native-updater/artifacts/test_artifacts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test --isolate scripts/native-updater/workflow.test.ts scripts/native-updater/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch exact signed-release artifacts and verify SHA-256 and sizes
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "native-updater-acceptance/$env:GITHUB_RUN_ID/$env:CASE"
          python scripts/native-updater/artifacts/artifacts.py --target $env:TARGET --case-root $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch secondary installer only for coexistence test
        if: matrix.case == 'coexistence'
        id: secondary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "native-updater-acceptance/$env:GITHUB_RUN_ID/$env:CASE-secondary"
          python scripts/native-updater/artifacts/artifacts.py --target windows-x86_64-nsis --case-root $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise packaged provenance and actual native updater behavior
        env:
          MANIFEST: ${{ steps.artifacts.outputs.manifest }}
          SECONDARY_MANIFEST: ${{ steps.secondary.outputs.manifest }}
        run: |
          $probeArgs = @("--case", $env:CASE, "--manifest", $env:MANIFEST)
          if ($env:CASE -eq "coexistence") { $probeArgs += @("--secondary-manifest", $env:SECONDARY_MANIFEST) }
          bun scripts/native-updater/windows/run.ts @probeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve truthful native evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-${{ matrix.case }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-updater-acceptance/**/*.json
            ${{ runner.temp }}/native-updater-acceptance/**/*.log
            ${{ runner.temp }}/native-updater-acceptance/**/*.png

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: writable
            target: linux-x86_64-appimage
          - case: readonly
            target: linux-x86_64-appimage
    env:
      WALLPAPER_PICKER_NATIVE_ACCEPTANCE: "1"
      CASE: ${{ matrix.case }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify artifact and workflow contracts without native operations
        run: |
          python -B scripts/native-updater/artifacts/test_artifacts.py
          python -B -m unittest discover -s scripts/native-updater/linux -p 'test_*.py'
          bun test --isolate scripts/native-updater/workflow.test.ts scripts/native-updater/linux
      - name: Prepare disposable native GUI and mounted AppImage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb xauth dbus-x11 ffmpeg libwebkit2gtk-4.1-0 libayatana-appindicator3-1 webkit2gtk-driver
          if [ ! -c /dev/fuse ]; then sudo modprobe fuse; fi
          test -c /dev/fuse
          test "$(id -u)" -ne 0
      - name: Fetch exact signed-release artifacts and verify SHA-256 and sizes
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/native-updater/artifacts/artifacts.py --target "$TARGET" --case-root "$RUNNER_TEMP/native-updater-acceptance/$GITHUB_RUN_ID/$CASE"
      # This probe owns its Xvfb/DBus session and fails nonzero while acceptance is blocked.
      - name: Probe mounted AppImage inspector feasibility (not acceptance)
        env:
          MANIFEST: ${{ steps.artifacts.outputs.manifest }}
        run: |
          bun scripts/native-updater/linux/run.ts --case "$CASE" --manifest "$MANIFEST"
      - name: Preserve truthful native evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-linux-${{ matrix.case }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-updater-acceptance/**/*.json
            ${{ runner.temp }}/native-updater-acceptance/**/*.log
            ${{ runner.temp }}/native-updater-acceptance/**/*.png
